resources:
  jobs:
    airbnb_city_etl:
      name: airbnb_city_etl
      description: Bronze -> silver -> gold for one city. The city is the only required parameter.
      max_concurrent_runs: 2
      queue:
        enabled: true
      parameters:
        - name: city
          default: paris
        - name: snapshot_date
          default: ""
        - name: source_url
          default: ""
        - name: pipeline_version
          default: week1
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../pipeline/01_bronze_ingest.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../pipeline/02_silver_listings.py
            base_parameters:
              run_id: "{{job.run_id}}"
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../pipeline/03_gold_tables.py
            base_parameters:
              run_id: "{{job.run_id}}"

    airbnb_etl_all_cities:
      name: airbnb_etl_all_cities
      description: Runs airbnb_city_etl once per city. Adding a city = adding it to the cities list.
      queue:
        enabled: true
      parameters:
        - name: cities
          default: '["paris", "lyon"]'
        - name: pipeline_version
          default: week1
      tasks:
        - task_key: run_cities
          for_each_task:
            inputs: "{{job.parameters.cities}}"
            concurrency: 1
            task:
              task_key: run_city
              run_job_task:
                job_id: ${resources.jobs.airbnb_city_etl.id}
                job_parameters:
                  city: "{{input}}"
                  pipeline_version: "{{job.parameters.pipeline_version}}"
